name: Alertes de mercat

on:
  schedule:
    - cron: '*/5 7-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alertes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar vigilant
        run: node scripts/alertes.mjs

      - name: Desar historial
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/alertes.json data/alertes-estat.json
          if git diff --quiet --cached; then
            echo "Sense canvis"
          else
            git commit -m "alertes: actualitzacio automatica"
            git push
          fi
